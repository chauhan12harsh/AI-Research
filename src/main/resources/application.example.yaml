spring:
  application:
    name: ai-research

  datasource:
    url: jdbc:postgresql://localhost:5442/ai_research
    username: <username>
    password: <password>

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
      file-size-threshold: 2MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          timezone: UTC

  ai:
    google:
      genai:
        project-id: <google-cloud-project-id>
        api-key: <api-key>
        chat:
          options:
            model: gemini-2.5-flash-lite
            temperature: 0.2
        embedding:
          api-key: <api-key>
          project-id: <google-cloud-project-id>
          location: us-central1
          text:
            model: gemini-embedding-001
            dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  security:
    # Generate with: openssl rand -base64 32
    jwt-secret: <base64-encoded-32-byte-secret>
    refresh-token-cleanup-ms: 86400000

  cors:
    allowed-origins: http://localhost:5173

  storage:
    endpoint: <endpoint-url>
    region: <region>
    bucket: harsh-ai-research-bucket
    key-prefix: harsh_research
    key-id: <key-id>
    application-key: <application-key>
    path-style-access: true

  limits:
    max-file-bytes: 26214400
    workspace-bytes: 524288000
    max-pdf-pages: 800

  embedding:
    batch-size: 64

  ingestion:
    poll-interval-ms: 5000
    reconcile-interval-ms: 60000

  deletion:
    reconcile-interval-ms: 60000

server:
  port: 5000
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
