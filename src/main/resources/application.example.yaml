
spring:
  application:
    name: ai-research

  datasource:
    url: jdbc:postgresql://localhost:5442/ai_research
    username: <username>
    password: <password>

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          timezone: UTC

app:
  cors:
    allowed-origins: http://localhost:5173

  storage:
    endpoint: <endpoint-url>
    region: <region>
    bucket: harsh-ai-research-bucket
    key-prefix: harsh_research
    key-id: <key-id>
    application-key: <application-key>
    path-style-access: true

  limits:
    max-file-bytes: 26214400 # 25MB
    workspace-bytes: 524288000 #500MB
    max-pdf-pages: 800

server:
  port: 5000
