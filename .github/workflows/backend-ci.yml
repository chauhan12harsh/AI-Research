name: Backend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_research
          POSTGRES_USER: ai_research
          POSTGRES_PASSWORD: ai_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_research -d ai_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_research
      SPRING_DATASOURCE_USERNAME: ai_research
      SPRING_DATASOURCE_PASSWORD: ai_research
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      SPRING_AI_GOOGLE_GENAI_API_KEY: test-key-for-context-startup
      SPRING_AI_GOOGLE_GENAI_PROJECT_ID: test-project
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_API_KEY: test-key-for-context-startup
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_PROJECT_ID: test-project
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_LOCATION: us-central1
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_TEXT_MODEL: gemini-embedding-001
      SPRING_AI_GOOGLE_GENAI_EMBEDDING_TEXT_DIMENSIONS: "768"
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "true"
      SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS: "768"
      APP_SECURITY_JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_STORAGE_ENDPOINT: http://127.0.0.1:9000
      APP_STORAGE_REGION: us-east-1
      APP_STORAGE_BUCKET: ai-research-ci
      APP_STORAGE_KEY_PREFIX: ci
      APP_STORAGE_KEY_ID: test-key
      APP_STORAGE_APPLICATION_KEY: test-secret
      APP_STORAGE_PATH_STYLE_ACCESS: "true"
      APP_LIMITS_MAX_FILE_BYTES: "26214400"
      APP_LIMITS_WORKSPACE_BYTES: "524288000"
      APP_LIMITS_MAX_PDF_PAGES: "800"
      APP_EMBEDDING_BATCH_SIZE: "64"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
